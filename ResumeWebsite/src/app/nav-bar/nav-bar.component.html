<header class="site-header">
  <nav class="nav-bar" aria-label="Primary navigation">
    <ul class="nav-links">
      @for (item of navItems; track item.fragment) {
        <li>
          <a
            [routerLink]="['/']"
            [class.active]="activeFragment === item.fragment"
            [fragment]="item.fragment"
          >
            {{ item.label }}
          </a>
        </li>
      }
    </ul>
  </nav>
</header>
