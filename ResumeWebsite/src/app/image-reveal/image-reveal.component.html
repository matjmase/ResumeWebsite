<figure
  class="image-reveal"
  tabindex="0"
  role="button"
  [attr.aria-label]="'Select ' + title()"
  (click)="emitFileName()"
  (keydown.enter)="emitFileName()"
  (keydown.space)="onSpaceKey($event)"
>
  <img [src]="imageSrc()" [alt]="imageAlt()" />
  <figcaption class="overlay">
    <div class="overlay-content">
      <h3>{{ title() }}</h3>
      <p>{{ description() }}</p>
    </div>
  </figcaption>
</figure>
