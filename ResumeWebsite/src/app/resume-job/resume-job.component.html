<h4 class="job-heading">
  <button
    type="button"
    [attr.aria-expanded]="expanded()"
    [attr.aria-controls]="descriptionId"
    (click)="toggleJob()"
  >
    <span class="job-arrow" [class.expanded]="expanded()" aria-hidden="true"
      >&rsaquo;</span
    >
    <span>{{ title() }}</span>
  </button>
</h4>
<div
  [id]="descriptionId"
  class="job-description"
  [class.expanded]="expanded()"
  [attr.aria-hidden]="!expanded()"
>
  <div>
    <p>{{ description() }}</p>
  </div>
</div>
