name: Deploy Angular to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ResumeWebsite

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ResumeWebsite/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Angular application
        run: npm run build -- --base-href "/ResumeWebsite/"

      - name: Prepare GitHub Pages files
        run: |
          INDEX_FILE="$(find dist -type f -name "index.html" | head -n 1)"
          test -n "$INDEX_FILE"
          OUTPUT_DIR="$(dirname "$INDEX_FILE")"

          echo "Using Angular output directory: $OUTPUT_DIR"

          mkdir -p pages-output
          cp -R "$OUTPUT_DIR"/. pages-output/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload compiled website
        uses: actions/upload-pages-artifact@v4
        with:
          path: ResumeWebsite/pages-output

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
